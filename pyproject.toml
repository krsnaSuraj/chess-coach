[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-coach"
version = "3.0.0"
description = "v3.0 'The Humanizer' - anti-detection chess sidekick with Nova, Stockfish 18 + Maia"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "python-chess>=1.999",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests>=2.28",
    "onnxruntime>=1.16.0",
    "xgboost>=2.0.0",
    "huggingface-hub>=0.20.0",
]

[project.scripts]
chess-coach = "chess_coach.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov>=4",
]
sota = [
    "httpx>=0.24",
    "websockets>=11",
]
maia2 = [
    "torch>=2.0",
    "transformers>=4.40",
]
nova = [
    "onnxruntime>=1.16.0",
    "xgboost>=2.0.0",
    "huggingface-hub>=0.20.0",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "black>=23",
    "ruff>=0.1",
    "mypy>=1.4",
    "pre-commit>=3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
