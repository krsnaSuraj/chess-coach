[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-coach"
version = "3.0.0"
description = "v3.0 'The Humanizer' — anti-detection chess sidekick with Stockfish 18 + Maia 1 (optional)"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "python-chess>=1.999",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "pydantic",
    "requests>=2.28",
]

[project.scripts]
chess-coach = "chess_coach.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
