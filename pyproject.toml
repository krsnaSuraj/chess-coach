[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-coach"
version = "0.1.0"
description = "Real-time chess analysis sidekick with Stockfish 18"
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6",
    "python-chess==1.999",
    "PyYAML==6.0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
]

[project.scripts]
chess-coach = "chess_coach.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pytest-cov>=4",
    "httpx>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
