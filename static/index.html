<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chess Coach v3.0.0 — SOTA</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="/static/css/themes.css">
  <link rel="stylesheet" href="/static/css/chessboard.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>♛ Chess Coach</h1>
      <span class="subtitle" id="subtitle">v3.0.0 SOTA</span>
      <span class="spacer"></span>
      <div class="theme-picker">
        <label for="themeSelect" style="font-size:12px;color:var(--text-dim);">Theme:</label>
        <select id="themeSelect" aria-label="Theme picker">
          <option value="midnight">Midnight</option>
          <option value="forest">Forest</option>
          <option value="sunset">Sunset</option>
          <option value="marble">Marble</option>
          <option value="lichess">Lichess</option>
          <option value="blue_glass">Blue Glass</option>
          <option value="cyber_neon">Cyber Neon</option>
          <option value="sepia">Sepia</option>
        </select>
      </div>
      <button id="flipBtn" title="Flip board (F)">⇅ Flip</button>
      <button id="settingsBtn" title="Settings (F2)">⚙</button>
    </header>

    <main class="board-area">
      <div class="cb-board" id="board" role="application" aria-label="Chess board"></div>
    </main>

    <aside class="sidebar" id="sidebar">
      <div class="panel" id="evalPanel">
        <h3>📊 Evaluation</h3>
        <div class="row"><span class="label">Score</span><span class="data" id="evalCp">—</span></div>
        <div class="row"><span class="label">Depth</span><span class="data" id="evalDepth">—</span></div>
        <div class="row"><span class="label">Best</span><span class="data" id="bestMove">—</span></div>
        <div class="wdl-bar" id="wdlBar" style="margin-top:8px;">
          <div class="w" id="wdlW">W —</div>
          <div class="d" id="wdlD">D —</div>
          <div class="l" id="wdlL">L —</div>
        </div>
      </div>

      <div class="panel" id="wpPanel">
        <h3>📈 Win Probability</h3>
        <svg class="wp-chart" id="wpChart" viewBox="0 0 100 30" preserveAspectRatio="none">
          <line x1="0" y1="15" x2="100" y2="15" stroke="var(--text-dim)" stroke-dasharray="2,2" stroke-width="0.3"/>
        </svg>
      </div>

      <div class="panel" id="capturedPanel">
        <h3>♟ Captured</h3>
        <div class="captured-row" id="capBlack">
          <span style="color:var(--text-dim);font-size:11px;width:14px;">W</span>
          <span class="material" id="capBlackMat">+0</span>
        </div>
        <div class="captured-row" id="capWhite">
          <span style="color:var(--text-dim);font-size:11px;width:14px;">B</span>
          <span class="material" id="capWhiteMat">+0</span>
        </div>
      </div>

      <div class="panel" id="moveListPanel">
        <h3>📜 Moves</h3>
        <div class="move-list" id="moveList" role="log" aria-live="polite"></div>
      </div>

      <div class="panel" id="coachPanel">
        <h3>🧠 Coach</h3>
        <div id="coachText" style="font-size:12px;line-height:1.5;color:var(--text-dim);">
          Loading coach…
        </div>
      </div>

      <div class="panel" id="riskPanel">
        <h3>⚠ Risk</h3>
        <div class="row"><span class="label">Score</span><span class="data" id="riskScore">—</span></div>
        <div class="row"><span class="label">Level</span><span class="data" id="riskLevel">—</span></div>
      </div>
    </aside>

    <footer class="footer">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Connecting…</span>
      <span class="spacer" style="flex:1;"></span>
      <span id="eloText">ELO ~ —</span>
      <span>·</span>
      <span id="moveCount">Move 0</span>
    </footer>
  </div>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <script src="/static/js/sound.js"></script>
  <script src="/static/js/board.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/service-worker.js').catch(() => {});
    }
  </script>
</body>
</html>
